[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "groqflow"
version = "1.0.0"
description = "GroqFlow: a multi-tenant document assistant with retrieval and booking workflows"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "faiss-cpu>=1.12.0",
    "langchain-community==0.2.6",
    "langchain-core==0.2.43",
    "langchain-groq==0.1.6",
    "langchain-huggingface==0.0.3",
    "langgraph==0.2.28",
    "mlflow>=2.13.0",
    "numpy>=1.26,<2",
    "opencv-python>=4.8,<4.12",
    "pydantic>=2.10,<2.11",
    "PyMuPDF>=1.24,<2",
    "pypdf==4.3.1",
    "python-dotenv==1.0.1",
    "PyYAML>=6.0",
    "rapidocr-onnxruntime>=1.2,<1.3",
    "sentence-transformers==3.0.1",
    "streamlit>=1.36,<2.0",
    "watchdog==4.0.2",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.4.0"]

[tool.groqflow]
product-name = "GroqFlow"

[tool.setuptools.packages.find]
where = ["src"]
include = ["groqflow*"]

[tool.ruff]
target-version = "py311"
line-length = 88
extend-exclude = ["vector_db", "uploaded_documents", "mlruns"]

[tool.ruff.lint]
ignore = ["BLE001", "S110", "LOG015", "RUF012", "SIM117"]

[tool.ruff.lint.per-file-ignores]
"app.py" = ["E402"]
"monitor.py" = ["E402"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]